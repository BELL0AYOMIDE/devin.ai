
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devin - Log in</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="index.html">
</head>
<body>

    <main class="login-container">

        <div class="login-box">

            <!-- Devin Logo -->
            <div class="logo">
                <span class="logo-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
                <h2>Devin</h2>
            </div>

            <!-- Signup Link -->
            <p class="signup">
                Don't have an account?
                <a href="#">Sign up</a>
            </p>

            <!-- Social Login Buttons -->
            <div class="social-buttons">

                <button class="social-btn">
                    <span class="icon github">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.04c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.01-.7.08-.69.08-.69 1.12.08 1.71 1.15 1.71 1.15 1 .1.77 2.06 3.15 2.06.9 0 1.6-.3 2.16-.75-2.77-.31-5.68-1.39-5.68-6.17 0-1.36.49-2.47 1.29-3.34-.13-.32-.56-1.59.12-3.3 0 0 1.05-.34 3.44 1.27a11.9 11.9 0 0 1 6.26 0c2.39-1.61 3.44-1.27 3.44-1.27.68 1.71.25 2.98.12 3.3.8.87 1.28 1.98 1.28 3.34 0 4.79-2.92 5.85-5.7 6.16.45.39.78 1.01.78 2.04V22c0 .29.2.64.77.53A11.1 11.1 0 0 0 12 .9Z"/>
                        </svg>
                    </span>
                    Continue with GitHub
                </button>

                <button class="social-btn">
                    <span class="icon chatgpt">✳</span>
                    Continue with ChatGPT
                </button>

                <button class="social-btn">
                    <span class="icon google">G</span>
                    Continue with Google
                </button>

            </div>

            <!-- Divider -->
            <div class="divider">
                <span></span>
                <p>OR</p>
                <span></span>
            </div>

            <!-- Email Login -->
            <form class="login-form">

                <input
                    type="email"
                    placeholder="Email address"
                    required
                >

                <button type="submit" class="login-btn">
                    Log in
                </button>

            </form>

        </div>

    </main>

</body>
</html>
